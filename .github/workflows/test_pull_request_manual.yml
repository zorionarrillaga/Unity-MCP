name: test-pull-request-manual

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to test (empty = test the branch this run was dispatched on)"
        required: false
        type: string

jobs:
  # Resolve what to test. A PR opened from a fork lives in THIS repository as
  # refs/pull/<n>/merge, so dispatching this workflow on a branch here and
  # naming the PR number runs the full licensed suite against a fork's code
  # without granting that code access to the secrets on any other trigger.
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Testing ${{ github.ref }} (no PR number given)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pr must be a number, got '$PR'"; exit 1 ;;
          esac
          remote="${{ github.server_url }}/${{ github.repository }}"
          if git ls-remote --exit-code "$remote" "refs/pull/$PR/merge" >/dev/null 2>&1; then
            ref="refs/pull/$PR/merge"
          elif git ls-remote --exit-code "$remote" "refs/pull/$PR/head" >/dev/null 2>&1; then
            ref="refs/pull/$PR/head"
            echo "::warning::PR #$PR has no merge ref (conflicts, or it is closed) - testing its head instead."
          else
            echo "::error::No refs/pull/$PR/* in ${{ github.repository }}. Is #$PR a pull request on this repository?"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing PR #$PR via \`$ref\`." >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  test-cli:
    needs: resolve
    uses: ./.github/workflows/test_cli.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  # --- UNITY TESTS ---
  # -------------------

  # --- EDIT MODE ---

  test-unity-2022-3-62f3-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "editmode"
    secrets: inherit

  test-unity-2023-2-22f1-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "editmode"
    secrets: inherit

  test-unity-6000-3-1f1-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "editmode"
    secrets: inherit

